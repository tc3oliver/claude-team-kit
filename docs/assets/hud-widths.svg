<svg xmlns="http://www.w3.org/2000/svg" width="893" height="522" viewBox="0 0 893 522" role="img" aria-label="The CTK HUD at 200, 130, 100, 80 and 60 terminal columns, with and without the status line"><title>The CTK HUD at five terminal widths</title><desc>Rows copied from live captures of Claude Code 2.1.295, recorded 2026-10-09. Rows copied from tmux captures of a live session after one ls and one read tool call; the terminal was resized between captures. Usage figures are the maintainer account at that moment.</desc><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;fill:#c9d1d9;white-space:pre}.h{font-size:15px;font-weight:700;fill:#f0f6fc}.s{font-size:12px;fill:#8b949e}.l{font-size:12px;fill:#8b949e}.band{fill:#c9d1d9}.status{fill:#a5d6ff}.d{fill:#6e7681}</style><rect width="893" height="522" rx="10" fill="#0d1117"/><text x="20" y="34" class="h">Plugin only</text><text x="20" y="52" class="s">One line above the prompt. The form follows the terminal width.</text><text x="20" y="78" class="l">200 columns</text><text x="150" y="78" class="band" xml:space="preserve">Sonnet 5.5<tspan class="d"> │ </tspan>5h 5% (4h13m)<tspan class="d"> │ </tspan>Wk 51% (4d8h)<tspan class="d"> │ </tspan>Tools 2<tspan class="d"> │ </tspan>Agents 0/3<tspan class="d"> │ </tspan>Ctx 4%<tspan class="d"> │ </tspan>$0.06 (12s)</text><text x="20" y="100" class="l">130 columns</text><text x="150" y="100" class="band" xml:space="preserve">Sonnet 5.5<tspan class="d"> │ </tspan>5h 5% (4h13m)<tspan class="d"> │ </tspan>Wk 51% (4d8h)<tspan class="d"> │ </tspan>Tools 2<tspan class="d"> │ </tspan>Agents 0/3<tspan class="d"> │ </tspan>Ctx 4%<tspan class="d"> │ </tspan>$0.06 (12s)</text><text x="20" y="122" class="l">100 columns</text><text x="150" y="122" class="band" xml:space="preserve">Sonnet 5.5<tspan class="d"> │ </tspan>5h 5% 4h13m<tspan class="d"> │ </tspan>Wk 51% 4d8h<tspan class="d"> │ </tspan>T2<tspan class="d"> │ </tspan>A0/3<tspan class="d"> │ </tspan>Ctx 4%<tspan class="d"> │ </tspan>$0.06</text><text x="20" y="144" class="l">80 columns</text><text x="150" y="144" class="band" xml:space="preserve">Sonnet 5.5<tspan class="d"> │ </tspan>5h 5% 4h13m<tspan class="d"> │ </tspan>Wk 51% 4d8h<tspan class="d"> │ </tspan>T2<tspan class="d"> │ </tspan>A0/3<tspan class="d"> │ </tspan>Ctx 4%<tspan class="d"> │ </tspan>$0.06</text><text x="20" y="166" class="l">60 columns</text><text x="150" y="166" class="band" xml:space="preserve">5h 5% 4h13m<tspan class="d"> │ </tspan>Wk 51% 4d8h<tspan class="d"> │ </tspan>T2</text><text x="20" y="206" class="h">With the optional status line</text><text x="20" y="224" class="s">Split by what each can know, so nothing is drawn twice. Top: above the prompt. Bottom: under it.</text><text x="20" y="250" class="l">200 columns</text><text x="150" y="250" class="band" xml:space="preserve">Tools 2<tspan class="d"> │ </tspan>Agents 0/3</text><text x="20" y="272" class="l"> </text><text x="20" y="272" class="l"></text><text x="150" y="272" class="status" xml:space="preserve">Sonnet 5.5 medium<tspan class="d"> │ </tspan>5h 5% (4h12m)<tspan class="d"> │ </tspan>Wk 51% (4d8h)<tspan class="d"> │ </tspan>Ctx 4%<tspan class="d"> │ </tspan>$0.07 (35s)<tspan class="d"> │ </tspan>main</text><text x="20" y="300" class="l">130 columns</text><text x="150" y="300" class="band" xml:space="preserve">Tools 2<tspan class="d"> │ </tspan>Agents 0/3</text><text x="20" y="322" class="l"> </text><text x="20" y="322" class="l"></text><text x="150" y="322" class="status" xml:space="preserve">Sonnet 5.5 medium<tspan class="d"> │ </tspan>5h 5% (4h12m)<tspan class="d"> │ </tspan>Wk 51% (4d8h)<tspan class="d"> │ </tspan>Ctx 4%<tspan class="d"> │ </tspan>$0.07 (39s)<tspan class="d"> │ </tspan>main</text><text x="20" y="350" class="l">100 columns</text><text x="150" y="350" class="band" xml:space="preserve">T2<tspan class="d"> │ </tspan>A0/3</text><text x="20" y="372" class="l">