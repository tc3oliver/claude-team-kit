name: Feature request
description: Suggest a change. CTK is deliberately small: say what problem it solves and why native Claude Code does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including whether native Claude Code settings, skills or subagents already cover it.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not add a second agent runtime, scheduler, memory system or hosted service.
          required: true
