name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: CLI smoke
        run: node dist/src/cli/bin.js --version

  plugin:
    # claude plugin validate/test need the Claude Code binary but no login and no network at test time.
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate plugin/ctk --strict
      - run: claude plugin validate . --strict
      - run: claude plugin test plugin/ctk
      - name: Always-on context budget
        run: node scripts/measure-context.mjs 500

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: No generated or local files in the tarball
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const f=require('./pack.json')[0].files.map(x=>x.path); const bad=f.filter(p=>/(^|\/)(\.omc|node_modules|\.claude-plugin\/types)\//.test(p)||/\.poc$/.test(p)); if(bad.length){console.error('unexpected files',bad);process.exit(1)}"
